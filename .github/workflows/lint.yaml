---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    # yamllint disable-line rule:line-length
    uses: hassio-addons/workflows/.github/workflows/repository-lint.yaml@adec4b96071354cc44924a6ef9975ff60cf9ddd9  # v5.0.0
