---
configuration:
  configuration_file:
    name: configuration file
    # yamllint disable-line rule:line-length
    description: config file of older versions of this app, its controllers are imported into the options and the file is renamed to .migrated afterwards. Deprecated, will be removed in a future release.
  autodetect_address:
    name: autodetect ip address
    # yamllint disable-line rule:line-length
    description: autodetect (broadcast) ip address in network (eg. ip 192.168.1.44 mask 255.255.255.0 -> detect address is 192.168.1.255). Only required if autodetect is not working.
  push_enabled:
    name: push enabled
    # yamllint disable-line rule:line-length
    description: receive and acknowledge push messages sent by controllers
  verbose_level:
    name: verbose level log output
    description: verbose level of log output
  controllers:
    name: manual controllers
    # yamllint disable-line rule:line-length
    description: controllers that are not found by autodetect (nad is the serial number of the controller, eg. 1000)
    fields:
      nad:
        name: nad
        description: network address or serial number of the controller (eg. 1000 for controller c1000)
      ip:
        name: ip address
        description: ip address of the controller
      port:
        name: port
        description: UDP port of the controller, by default 8442
      password:
        name: password
        description: numeric password of the controller, omit if the controller has no password
network:
  4000/tcp: SCGI port (Used for Integrations. eg. ha-hiq)
  8442/udp: Abus push port
